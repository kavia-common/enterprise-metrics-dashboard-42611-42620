<section class="login-shell">
  <div class="panel">
    <div class="brand">
      <span class="logo">⦿</span>
      <h1>Sign in</h1>
      <p class="subtitle">Access your enterprise dashboard</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <div class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          <span *ngIf="form.controls.email.errors?.['required']">Email is required.</span>
          <span *ngIf="form.controls.email.errors?.['email']">Enter a valid email.</span>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        <div class="error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          <span *ngIf="form.controls.password.errors?.['required']">Password is required.</span>
          <span *ngIf="form.controls.password.errors?.['minlength']">Minimum 4 characters.</span>
        </div>
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>
      <div class="error global" *ngIf="error">{{ error }}</div>

      <div class="hint">
        Try: admin&#64;example.com / admin123 or alex&#64;example.com / password
      </div>
    </form>
  </div>
</section>
