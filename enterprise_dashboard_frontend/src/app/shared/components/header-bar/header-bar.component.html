<header class="header">
  <div class="left">
    <div class="brand">
      <span class="logo">⦿</span>
      <span class="title">{{ title }}</span>
    </div>
    <div class="search">
      <input
        #searchBox
        type="search"
        placeholder="Search..."
        (input)="onSearch(searchBox.value)"
        aria-label="Search dashboard">
    </div>
  </div>
  <div class="right">
    <div class="dropdown" [class.open]="exportOpen" (keyup.escape)="closeExport()" (click)="$event.stopPropagation()">
      <button
        class="action"
        aria-haspopup="menu"
        [attr.aria-expanded]="exportOpen ? 'true' : 'false'"
        aria-controls="export-menu"
        title="Export data"
        (click)="toggleExportMenu(); $event.stopPropagation()">
        ⬇ Export
      </button>
      <ul
        id="export-menu"
        class="menu"
        *ngIf="exportOpen"
        role="menu"
        (click)="$event.stopPropagation()">
        <li role="none">
          <button role="menuitem"
                  class="menu-item"
                  type="button"
                  (click)="exportCsv(); $event.stopPropagation()"
                  [disabled]="!hasRows"
                  [attr.aria-disabled]="hasRows ? 'false' : 'true'">
            CSV
          </button>
        </li>
        <li role="none">
          <button role="menuitem"
                  class="menu-item"
                  type="button"
                  (click)="exportJson(); $event.stopPropagation()"
                  [disabled]="!hasRows"
                  [attr.aria-disabled]="hasRows ? 'false' : 'true'">
            JSON
          </button>
        </li>
      </ul>
    </div>

    <button class="action" aria-label="Notifications" title="Notifications">🔔</button>
    <button class="action" (click)="toggleTheme()"
            [attr.aria-pressed]="theme === 'dark' ? 'true' : 'false'"
            [title]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
      {{ theme === 'dark' ? '🌙' : '☀️' }}
    </button>
  </div>
</header>
