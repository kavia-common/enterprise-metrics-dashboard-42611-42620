<header class="header">
  <div class="left">
    <div class="brand">
      <span class="logo">⦿</span>
      <span class="title">{{ title }}</span>
    </div>
    <div class="search">
      <input
        #searchBox
        type="search"
        placeholder="Search..."
        (input)="onSearch(searchBox.value)"
        aria-label="Search dashboard">
    </div>
  </div>
  <div class="right">
    <button class="action" aria-label="Notifications" title="Notifications">🔔</button>
    <button class="action" (click)="toggleTheme()"
            [attr.aria-pressed]="theme === 'dark' ? 'true' : 'false'"
            [title]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
      {{ theme === 'dark' ? '🌙' : '☀️' }}
    </button>

    <ng-container *ngIf="user; else loginBtn">
      <a class="user" title="Account" routerLink="/profile">
        <img src="https://avatars.githubusercontent.com/u/0?v=4" alt="User avatar" />
        <span class="name">{{ user.name }}</span>
      </a>
      <button class="action" (click)="logout()" aria-label="Logout" title="Logout">⎋</button>
    </ng-container>
    <ng-template #loginBtn>
      <a class="action" routerLink="/login" aria-label="Login" title="Login">Login</a>
    </ng-template>
  </div>
</header>
